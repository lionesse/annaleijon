name: IndexNow

# Anmäler ändrade sidor på annaleijon.se till IndexNow (Bing, Yandex, Seznam m.fl.)
# Körs automatiskt när HTML-filer, sitemap.xml eller llms.txt ändras.
# Kan också köras manuellt (fliken Actions -> IndexNow -> Run workflow), då skickas alla sidor i sitemap.xml.

on:
  push:
    branches: [master]
    paths:
      - '**.html'
      - 'sitemap.xml'
      - 'llms.txt'
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vänta på att GitHub Pages publicerat ändringarna
        run: sleep 90

      - name: Skicka ändrade sidor till IndexNow
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.parse, urllib.request

          HOST = "annaleijon.se"
          KEY = "f6912bd5bxqgnrbek2b32dszxa3sbfcq"
          BASE = "https://" + HOST + "/"

          def url_for(path):
              if path == "index.html":
                  return BASE
              return BASE + urllib.parse.quote(path)

          urls = []
          before = os.environ.get("BEFORE", "")
          if os.environ.get("EVENT_NAME") == "push" and before and not set(before) <= {"0"}:
              out = subprocess.run(
                  ["git", "-c", "core.quotePath=false", "diff", "--name-only", "--diff-filter=AM", before, os.environ["AFTER"]],
                  capture_output=True, text=True, check=True).stdout
              for p in out.splitlines():
                  p = p.strip()
                  if not p or "/" in p or p.startswith("test-"):
                      continue
                  if p.endswith(".html") or p in ("sitemap.xml", "llms.txt"):
                      urls.append(url_for(p))
          else:
              sm = open("sitemap.xml", encoding="utf-8").read()
              for loc in re.findall(r"<loc>\s*(.*?)\s*</loc>", sm):
                  p = urllib.parse.unquote(loc.replace("&amp;", "&").split(HOST + "/", 1)[-1]) or "index.html"
                  urls.append(url_for(p))

          urls = sorted(set(urls))
          print(f"{len(urls)} adresser att anmäla")
          for u in urls:
              print(" ", u)
          if not urls:
              raise SystemExit(0)

          body = json.dumps({
              "host": HOST,
              "key": KEY,
              "keyLocation": BASE + KEY + ".txt",
              "urlList": urls[:10000],
          }).encode("utf-8")
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow", data=body,
              headers={"Content-Type": "application/json; charset=utf-8"}, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("Svar från IndexNow:", r.status)
          except urllib.error.HTTPError as e:
              print("Svar från IndexNow:", e.code, e.read().decode("utf-8", "replace")[:500])
              if e.code not in (200, 202):
                  raise SystemExit(1)
          PY
